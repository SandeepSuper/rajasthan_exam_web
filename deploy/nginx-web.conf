# Serves the website and the API from the same domain, so no CORS is needed.
# 1. Build:   npm run build   → copy dist/ to /var/www/rajasthan_exam_web
# 2. Replace the "location /" block in the existing nginx.conf with the blocks below.
#    Keep the existing /api/ws/ and /api/ blocks as they are.

    # Backend static pages still served by Spring Boot
    location = /privacy-policy.html { proxy_pass http://localhost:8080; }
    location = /support.html        { proxy_pass http://localhost:8080; }
    location /admin                 { proxy_pass http://localhost:8080; proxy_set_header Host $host; }
    location /uploads/              { proxy_pass http://localhost:8080; }

    # Website (React single-page app)
    location / {
        root /var/www/rajasthan_exam_web;
        try_files $uri $uri/ /index.html;   # let React Router handle /exam/..., /test/... etc.
    }

    # Long cache for hashed build files
    location /assets/ {
        root /var/www/rajasthan_exam_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
